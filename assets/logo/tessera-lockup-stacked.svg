<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tessera stacked lockup · mark above wordmark
  For square spaces (avatar, app icon, sticker, business card).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Tessera">
  <title>Tessera</title>
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&amp;display=swap');
      .word { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 36px; letter-spacing: -0.02em; fill: #0E1B2C; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(88,40) scale(1)">
    <circle cx="32" cy="32" r="27.6" fill="none" stroke="#0E1B2C" stroke-width="4.36"/>
    <circle cx="32" cy="32" r="17.45" fill="#B85426"/>
  </g>

  <text class="word" x="120" y="170">Tessera</text>
</svg>
