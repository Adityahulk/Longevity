<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tessera Open Graph card · 1200×630 (standard og:image / Twitter card size)
  Cream background with centered lockup + small tagline below.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Tessera">
  <title>Tessera</title>
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .word { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 124px; letter-spacing: -0.02em; fill: #0E1B2C; text-anchor: middle; }
      .tag  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; fill: #B85426; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F1E8"/>

  <!-- Mark, centered above wordmark -->
  <g transform="translate(556,160) scale(1.4)">
    <circle cx="32" cy="32" r="27.6" fill="none" stroke="#0E1B2C" stroke-width="4.36"/>
    <circle cx="32" cy="32" r="17.45" fill="#B85426"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="600" y="430">Tessera</text>

  <!-- Tagline -->
  <text class="tag" x="600" y="490">Precision longevity, built on your bloodwork</text>
</svg>
